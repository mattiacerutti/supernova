name: Feature proposal
description: Propose a new feature or improvement.
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        Before opening a proposal, search for similar issues and discussions.

        Keep the proposal focused on the problem and user value. Brief implementation ideas are welcome but optional.

        Write the proposal in your own words. Proposals should come from a problem you have experienced, not ideas generated by an AI.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current limitation and who it affects.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
      description: Describe the desired behavior or user experience.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Briefly describe an implementation approach if you have one in mind.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing workarounds or alternatives you considered.
    validations:
      required: false
